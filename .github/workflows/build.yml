name: Build libiperf3

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build all ABIs (includes 16 KB alignment + JNI symbol checks)
        run: |
          nix build .#jniLibsZip -L
          cp result/jniLibs.zip jniLibs.zip
          unzip -l jniLibs.zip

      - name: Read pinned iperf version
        id: pin
        run: echo "version=$(jq -r .version iperf-version.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: jniLibs-iperf${{ steps.pin.outputs.version }}
          path: jniLibs.zip

      # Releases happen when:
      #  * a v* tag is pushed manually, or
      #  * main contains an iperf version that has no v<version> release yet
      #    (e.g. after merging an automated update PR).
      - name: Decide on release
        id: release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pin.outputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            case "$GITHUB_REF_NAME" in
              "v$VERSION"|"v$VERSION"-*) ;;
              *) echo "tag $GITHUB_REF_NAME does not match pinned iperf $VERSION" >&2; exit 1 ;;
            esac
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "release v$VERSION already exists, nothing to do"
          else
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.pin.outputs.version }}
        run: |
          # OMNT downloads releases/latest/download/jniLibs, so keep that asset name.
          cp jniLibs.zip jniLibs
          gh release create "$TAG" jniLibs jniLibs.zip \
            --target "$GITHUB_SHA" \
            --title "Release iPerf $TAG" \
            --notes "libiperf3.so built from upstream iperf $VERSION (https://github.com/esnet/iperf/releases/tag/$VERSION) for arm64-v8a, armeabi-v7a, x86 and x86_64, 16 KB page aligned. Load it with System.loadLibrary(\"iperf3\")."
